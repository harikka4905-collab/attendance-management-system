<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Subjects - Attendance Pro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            background: #0f172a;
            padding: 30px 20px;
            color: white;
        }

        .logo {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        nav a {
            text-decoration: none;
            color: #cbd5e1;
            padding: 14px;
            border-radius: 9px;
            transition: 0.3s;
        }

        nav a:hover,
        nav a.active {
            background: #2563eb;
            color: white;
            transform: translateX(5px);
        }

        .main {
            margin-left: 260px;
            width: calc(100% - 260px);
            padding: 35px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
        }

        .student-badge {
            background: white;
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .tools {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .search {
            flex: 1;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
        }

        .search:focus {
            outline: none;
            border-color: #2563eb;
        }

        .refresh {
            border: none;
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh:hover {
            background: #1d4ed8;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .summary-card p {
            color: #64748b;
            margin-bottom: 10px;
        }

        .summary-card h2 {
            font-size: 30px;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .subject-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            border-top: 4px solid #2563eb;
        }

        .subject-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .subject-icon {
            width: 55px;
            height: 55px;
            background: #dbeafe;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .subject-card h3 {
            margin-bottom: 8px;
        }

        .subject-code {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat strong {
            display: block;
            font-size: 20px;
        }

        .stat span {
            color: #64748b;
            font-size: 13px;
        }

        .progress-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .progress {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            border-radius: 20px;
            background: #22c55e;
            transition: width 0.8s;
        }

        .low {
            background: #ef4444;
        }

        .warning {
            margin-top: 15px;
            color: #dc2626;
            font-size: 13px;
            font-weight: bold;
        }

        .good-message {
            margin-top: 15px;
            color: #16a34a;
            font-size: 13px;
            font-weight: bold;
        }

        .loading,
        .empty {
            grid-column: 1 / -1;
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 15px;
            color: #64748b;
        }

        @media(max-width: 1100px) {
            .subjects {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 800px) {
            .sidebar {
                width: 200px;
            }

            .main {
                margin-left: 200px;
                width: calc(100% - 200px);
            }

            .subjects,
            .summary {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="logo">
            🎓 Attendance Pro
        </div>

        <nav>
            <a href="/student-dashboard">
                🏠 Dashboard
            </a>

            <a href="/student-attendance">
                📊 My Attendance
            </a>

            <a href="/student-subjects" class="active">
                📚 Subjects
            </a>

            <a href="/student-reports">
                📈 Reports
            </a>

            <a href="#" onclick="logout()">
                🚪 Logout
            </a>
        </nav>

    </aside>


    <main class="main">

        <div class="header">

            <div>
                <h1>📚 My Subjects</h1>
                <p>Explore your subjects and attendance performance</p>
            </div>

            <div class="student-badge">
                👨‍🎓 <strong id="studentName">Student</strong>
            </div>

        </div>


        <div class="tools">

            <input
                    type="text"
                    id="search"
                    class="search"
                    placeholder="🔍 Search subject..."
                    oninput="searchSubjects()">

            <button
                    class="refresh"
                    onclick="loadSubjects()">
                🔄 Refresh
            </button>

        </div>


        <div class="summary">

            <div class="summary-card">
                <p>📚 Total Subjects</p>
                <h2 id="totalSubjects">0</h2>
            </div>

            <div class="summary-card">
                <p>🏆 Best Attendance</p>
                <h2 id="bestAttendance">0%</h2>
            </div>

            <div class="summary-card">
                <p>📈 Overall Attendance</p>
                <h2 id="overallAttendance">0%</h2>
            </div>

        </div>


        <div class="subjects" id="subjectContainer">

            <div class="loading">
                ⏳ Loading your subjects...
            </div>

        </div>

    </main>

</div>


<script>

    let subjectsData = [];


    async function loadSubjects() {

        const token = localStorage.getItem("token");

        if (!token) {
            window.location.replace("/login");
            return;
        }

        const container =
            document.getElementById("subjectContainer");

        container.innerHTML = `
            <div class="loading">
                ⏳ Loading your subjects...
            </div>
        `;

        try {

            const response = await fetch(
                "/api/student-report/my-report",
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


            if (response.status === 401 ||
                response.status === 403) {

                localStorage.clear();

                window.location.replace("/login");

                return;
            }


            if (!response.ok) {

                const error =
                    await response.text();

                container.innerHTML = `
                    <div class="empty">
                        ❌ ${error}
                    </div>
                `;

                return;
            }


            const report =
                await response.json();


            document
                .getElementById("studentName")
                .innerText =
                report.studentName;


            subjectsData =
                report.subjects || [];


            document
                .getElementById("totalSubjects")
                .innerText =
                subjectsData.length;


            document
                .getElementById("overallAttendance")
                .innerText =
                report.overallPercentage + "%";


            let bestAttendance = 0;

            subjectsData.forEach(subject => {

                if (Number(subject.percentage) >
                    bestAttendance) {

                    bestAttendance =
                        Number(subject.percentage);

                }

            });


            document
                .getElementById("bestAttendance")
                .innerText =
                bestAttendance + "%";


            displaySubjects(subjectsData);

        }

        catch (error) {

            console.error(error);

            container.innerHTML = `
                <div class="empty">
                    ❌ Unable to load subjects
                </div>
            `;

        }

    }


    function displaySubjects(subjects) {

        const container =
            document.getElementById("subjectContainer");

        container.innerHTML = "";


        if (subjects.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    📚 No subjects found
                </div>
            `;

            return;

        }


        subjects.forEach((subject, index) => {

            const percentage =
                Number(subject.percentage);


            const message =
                percentage >= 75
                    ? `<div class="good-message">
                           ✅ Good attendance
                       </div>`
                    : `<div class="warning">
                           ⚠ Attendance below 75%
                       </div>`;


            const progressClass =
                percentage >= 75
                    ? "progress-bar"
                    : "progress-bar low";


            const card =
                document.createElement("div");


            card.className =
                "subject-card";


            card.innerHTML = `

                <div class="subject-icon">
                    ${getSubjectIcon(index)}
                </div>

                <h3>
                    ${subject.subjectName}
                </h3>

                <div class="subject-code">
                    Subject ${index + 1}
                </div>


                <div class="stats">

                    <div class="stat">

                        <strong>
                            ${subject.totalClasses}
                        </strong>

                        <span>
                            Classes
                        </span>

                    </div>


                    <div class="stat">

                        <strong>
                            ${subject.present}
                        </strong>

                        <span>
                            Present
                        </span>

                    </div>


                    <div class="stat">

                        <strong>
                            ${subject.absent}
                        </strong>

                        <span>
                            Absent
                        </span>

                    </div>

                </div>


                <div class="progress-title">

                    <span>
                        Attendance
                    </span>

                    <strong>
                        ${percentage}%
                    </strong>

                </div>


                <div class="progress">

                    <div
                        class="${progressClass}"
                        style="width:${percentage}%">
                    </div>

                </div>

                ${message}

            `;


            container.appendChild(card);

        });

    }


    function searchSubjects() {

        const search =
            document
                .getElementById("search")
                .value
                .toLowerCase();


        const filtered =
            subjectsData.filter(subject =>

                subject.subjectName
                    .toLowerCase()
                    .includes(search)

            );


        displaySubjects(filtered);

    }


    function getSubjectIcon(index) {

        const icons = [
            "💻",
            "🗄️",
            "🔐",
            "🌐",
            "🧠",
            "📊",
            "⚙️",
            "📱"
        ];

        return icons[
        index % icons.length
            ];

    }


    function logout() {

        localStorage.clear();

        window.location.replace("/login");

    }


    loadSubjects();

</script>

</body>

</html>
