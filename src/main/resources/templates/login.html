<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Attendance Pro - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            padding: 40px;

            background: white;
            border-radius: 15px;

            box-shadow: 0 10px 30px
            rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #cbd5e1;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;

            right: 10px;
            top: 10px;

            border: none;
            background: transparent;

            cursor: pointer;
            font-size: 18px;
        }

        .login-button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 7px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .login-button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;

            color: #dc2626;
            font-weight: bold;
        }

        .portal {
            text-align: center;

            margin-top: 25px;

            color: #64748b;
        }

        footer {
            text-align: center;

            margin-top: 25px;

            color: #94a3b8;
            font-size: 14px;
        }
    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">
        🎓
    </div>

    <h1>
        Attendance Pro
    </h1>

    <p class="subtitle">
        Smart Attendance Management System
    </p>


    <label for="username">
        Username
    </label>

    <input
            type="text"
            id="username"
            placeholder="Enter username or roll number"
            autocomplete="username">


    <label for="password">
        Password
    </label>

    <div class="password-container">

        <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password">

        <button
                type="button"
                class="show-password"
                onclick="togglePassword()">

            👁️

        </button>

    </div>


    <button
            type="button"
            id="loginButton"
            class="login-button"
            onclick="login()">

        Login

    </button>


    <p id="message"></p>


    <p class="portal">
        Student & Faculty Portal
    </p>


    <footer>
        © 2026 Attendance Pro
    </footer>

</div>


<script>

    function togglePassword() {

        const password =
            document.getElementById("password");

        if (password.type === "password") {

            password.type = "text";

        } else {

            password.type = "password";

        }

    }


    async function login() {

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const message =
            document.getElementById("message");

        const loginButton =
            document.getElementById("loginButton");


        message.innerText = "";


        if (username === "" || password === "") {

            message.innerText =
                "Please enter username and password";

            return;

        }


        try {

            loginButton.disabled = true;

            loginButton.innerText =
                "Logging in...";


            const response = await fetch(
                "/api/auth/login",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        username: username,

                        password: password

                    })

                }
            );


            if (!response.ok) {

                message.innerText =
                    "Invalid username or password";

                return;

            }


            const data =
                await response.json();


            const token =
                data.token;


            const role =
                String(data.role)
                    .replace("ROLE_", "")
                    .trim()
                    .toUpperCase();


            localStorage.setItem(
                "token",
                token
            );


            localStorage.setItem(
                "role",
                role
            );


            localStorage.setItem(
                "username",
                username
            );


            console.log(
                "Login successful"
            );


            console.log(
                "Role:",
                role
            );


            if (role === "ADMIN") {

                window.location.replace(
                    "/admin-dashboard"
                );

            }

            else if (role === "FACULTY") {

                window.location.replace(
                    "/faculty-dashboard"
                );

            }

            else if (role === "STUDENT") {

                window.location.replace(
                    "/student-dashboard"
                );

            }

            else {

                message.innerText =
                    "Unknown user role: " + role;

            }

        }

        catch (error) {

            console.error(
                "Login error:",
                error
            );


            message.innerText =
                "Login failed. Please try again.";

        }

        finally {

            loginButton.disabled = false;

            loginButton.innerText =
                "Login";

        }

    }


    document
        .getElementById("password")
        .addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    login();

                }

            }
        );

</script>

</body>

</html>
